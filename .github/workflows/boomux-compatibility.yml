name: Boomux Compatibility

on:
  workflow_call:
    inputs:
      boomux_tag:
        description: Exact published Boomux tag to validate
        required: true
        type: string
      plugin_ref:
        description: Immutable omarchy-boomux ref to test
        required: false
        type: string
        default: main
  workflow_dispatch:
    inputs:
      boomux_tag:
        description: Exact published Boomux tag to validate
        required: true
        type: string
      plugin_ref:
        description: omarchy-boomux ref to test
        required: false
        type: string
        default: main

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gardnmi/omarchy-boomux
          ref: ${{ inputs.plugin_ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Validate published Boomux release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/test-boomux-releases.sh "${{ inputs.boomux_tag }}"
