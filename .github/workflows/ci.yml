name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [boomux-release]
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: read

jobs:
  workspace-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Test Workspace model
        run: bun test tests
      - name: Validate release metadata
        run: bun scripts/validate-release.js
      - name: Require pull request version bump
        if: github.event_name == 'pull_request'
        run: bun scripts/validate-release.js "${{ github.event.pull_request.base.sha }}"
      - name: Benchmark Workspace model
        run: bun benchmarks/workspace-model.js --json | tee benchmark-results.json
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: workspace-model-benchmark
          path: benchmark-results.json
          if-no-files-found: error
          retention-days: 30

  boomux-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Test supported Boomux releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/test-boomux-releases.sh
