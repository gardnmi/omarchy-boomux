name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Test Workspace model
        run: bun test tests/workspace-model.test.js
      - name: Benchmark Workspace model
        run: bun benchmarks/workspace-model.js --json | tee benchmark-results.json
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: workspace-model-benchmark
          path: benchmark-results.json
          if-no-files-found: error
          retention-days: 30
